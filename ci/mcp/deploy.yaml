# GitLab pipeline {{PIPELINE_ID}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octo-cli-mcp
  namespace: "{{NAMESPACE}}"
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: octo-cli-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: octo-cli-mcp
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{TERMINATION_GRACE}}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: "{{IMAGE_PULL_SECRET}}"
      containers:
        - name: mcp
          image: "{{IMAGE}}"
          args:
            - mcp
            - serve
            - --listen=0.0.0.0:8765
            - --drain-delay={{DRAIN_DELAY}}s
            - --shutdown-timeout={{SHUTDOWN_TIMEOUT}}s
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: OCTO_API_BASE_URL
              value: "{{OCTO_GATEWAY_URL}}"
          readinessProbe:
            httpGet:
              port: http
              path: /readyz
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          resources:
            requests:
              cpu: "{{CPU_REQUEST}}"
              memory: "{{MEMORY_REQUEST}}"
            limits:
              cpu: "{{CPU_LIMIT}}"
              memory: "{{MEMORY_LIMIT}}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: octo-cli-mcp
  namespace: "{{NAMESPACE}}"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: octo-cli-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: octo-cli-mcp
  namespace: "{{NAMESPACE}}"
spec:
  parentRefs:
    - name: "{{GATEWAY_NAME}}"
      namespace: "{{GATEWAY_NAMESPACE}}"
      sectionName: "{{GATEWAY_LISTENER}}"
  hostnames:
    - "{{PUBLIC_HOST}}"
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - name: octo-cli-mcp
          port: 80
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: octo-cli-mcp
  namespace: "{{NAMESPACE}}"
  labels:
    app.kubernetes.io/name: octo-cli-mcp
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: octo-cli-mcp
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: octo-cli-mcp
  namespace: "{{NAMESPACE}}"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: octo-cli-mcp
  minReplicas: {{MIN_REPLICAS}}
  maxReplicas: {{MAX_REPLICAS}}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{TARGET_CPU}}
    - type: Pods
      pods:
        metric:
          name: octo_mcp_exec_inflight
        target:
          type: AverageValue
          averageValue: "{{TARGET_INFLIGHT}}"
